<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Entity Resolution Project Architecture</title>
  <desc id="desc">A hand-drawn style flowchart showing local company data enrichment with Crawl4AI, followed by the Databricks entity resolution, XAI, GraphRAG, AI Search, and AI Playground workflow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#1f2937"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.8" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
    <style>
      .page {
        fill: #fffdf8;
      }
      .title {
        font-family: "Comic Sans MS", "Segoe Print", "Bradley Hand", cursive;
        font-size: 32px;
        fill: #111827;
      }
      .frame {
        fill: rgba(255, 255, 255, 0.62);
        stroke: #111827;
        stroke-width: 2.4;
        stroke-dasharray: 9 9;
        rx: 24;
      }
      .frame-label {
        font-family: "Comic Sans MS", "Segoe Print", "Bradley Hand", cursive;
        font-size: 18px;
        fill: #374151;
      }
      .box {
        stroke: #1f2937;
        stroke-width: 1.7;
        rx: 13;
        filter: url(#softShadow);
      }
      .node-text {
        font-family: "Comic Sans MS", "Segoe Print", "Bradley Hand", cursive;
        font-size: 18px;
        fill: #111827;
        text-anchor: middle;
      }
      .node-subtext {
        font-family: "Comic Sans MS", "Segoe Print", "Bradley Hand", cursive;
        font-size: 14px;
        fill: #374151;
        text-anchor: middle;
      }
      .arrow {
        fill: none;
        stroke: #1f2937;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow);
      }
      .arrow-label {
        font-family: "Comic Sans MS", "Segoe Print", "Bradley Hand", cursive;
        font-size: 14px;
        fill: #d92d20;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1600" height="1180"/>
  <text class="title" x="800" y="54" text-anchor="middle">Entity Resolution Project Architecture</text>

  <rect class="frame" x="55" y="90" width="690" height="1040"/>
  <text class="frame-label" x="94" y="124">Local machine</text>
  <circle cx="76" cy="118" r="6" fill="#5dade2"/>

  <rect class="frame" x="855" y="90" width="690" height="1040"/>
  <text class="frame-label" x="894" y="124">Databricks workspace</text>
  <circle cx="876" cy="118" r="6" fill="#ff7f50"/>

  <!-- Local enrichment flow -->
  <g>
    <rect class="box" x="100" y="165" width="235" height="82" fill="#fff4bf"/>
    <text class="node-text" x="217.5" y="198">Local setup</text>
    <text class="node-subtext" x="217.5" y="224">environment + config</text>
  </g>

  <g>
    <rect class="box" x="100" y="315" width="270" height="86" fill="#d9ecff"/>
    <text class="node-text" x="235" y="350">Raw company data</text>
    <text class="node-subtext" x="235" y="376">attributes + website/social URLs</text>
  </g>

  <g>
    <rect class="box" x="475" y="315" width="250" height="94" fill="#d8f3dc"/>
    <text class="node-text" x="600" y="348">URL preparation</text>
    <text class="node-subtext" x="600" y="373">normalize URLs</text>
    <text class="node-subtext" x="600" y="394">remove duplicate crawl targets</text>
  </g>

  <g>
    <rect class="box" x="475" y="500" width="250" height="94" fill="#e7f0ff"/>
    <text class="node-text" x="600" y="533">Crawl4AI crawling</text>
    <text class="node-subtext" x="600" y="558">websites + social pages</text>
    <text class="node-subtext" x="600" y="579">shallow crawl</text>
  </g>

  <g>
    <rect class="box" x="100" y="500" width="270" height="94" fill="#ffe5d9"/>
    <text class="node-text" x="235" y="533">Signal extraction</text>
    <text class="node-subtext" x="235" y="558">HTML + Markdown</text>
    <text class="node-subtext" x="235" y="579">JSON-LD + contacts</text>
  </g>

  <g>
    <rect class="box" x="100" y="685" width="270" height="94" fill="#fce1f0"/>
    <text class="node-text" x="235" y="718">Geo validation</text>
    <text class="node-subtext" x="235" y="743">TLD + language</text>
    <text class="node-subtext" x="235" y="764">country/city evidence</text>
  </g>

  <g>
    <rect class="box" x="475" y="685" width="250" height="94" fill="#eadcff"/>
    <text class="node-text" x="600" y="718">Field enrichment</text>
    <text class="node-subtext" x="600" y="743">KEEP / ADD / REPLACE</text>
    <text class="node-subtext" x="600" y="764">confidence rules</text>
  </g>

  <g>
    <rect class="box" x="475" y="870" width="250" height="82" fill="#dff7ff"/>
    <text class="node-text" x="600" y="904">ER-ready export</text>
    <text class="node-subtext" x="600" y="930">data_er_ready.csv</text>
  </g>

  <!-- Databricks flow -->
  <g>
    <rect class="box" x="930" y="165" width="230" height="82" fill="#fff4bf"/>
    <text class="node-text" x="1045" y="198">Upload CSV</text>
    <text class="node-subtext" x="1045" y="224">Unity Catalog volume</text>
  </g>

  <g>
    <rect class="box" x="930" y="315" width="235" height="86" fill="#d9ecff"/>
    <text class="node-text" x="1047.5" y="350">Load + clean</text>
    <text class="node-subtext" x="1047.5" y="376">standardize records</text>
  </g>

  <g>
    <rect class="box" x="1280" y="315" width="235" height="86" fill="#d8f3dc"/>
    <text class="node-text" x="1397.5" y="350">Generate pairs</text>
    <text class="node-subtext" x="1397.5" y="376">candidate companies</text>
  </g>

  <g>
    <rect class="box" x="1280" y="500" width="235" height="94" fill="#e7f0ff"/>
    <text class="node-text" x="1397.5" y="533">Score pairs</text>
    <text class="node-subtext" x="1397.5" y="558">string + semantic</text>
    <text class="node-subtext" x="1397.5" y="579">location signals</text>
  </g>

  <g>
    <rect class="box" x="930" y="500" width="235" height="94" fill="#ffe5d9"/>
    <text class="node-text" x="1047.5" y="529">Deterministic</text>
    <text class="node-text" x="1047.5" y="552">decision</text>
    <text class="node-subtext" x="1047.5" y="578">rules + thresholds</text>
  </g>

  <g>
    <rect class="box" x="930" y="685" width="235" height="86" fill="#fce1f0"/>
    <text class="node-text" x="1047.5" y="721">LLM tie-breaker</text>
    <text class="node-subtext" x="1047.5" y="747">resolve ambiguous cases</text>
  </g>

  <g>
    <rect class="box" x="1280" y="620" width="235" height="86" fill="#eadcff"/>
    <text class="node-text" x="1397.5" y="656">Final decisions</text>
    <text class="node-subtext" x="1397.5" y="682">match outcomes</text>
  </g>

  <g>
    <rect class="box" x="1280" y="840" width="235" height="86" fill="#dff7ff"/>
    <text class="node-text" x="1397.5" y="876">Knowledge graph</text>
    <text class="node-subtext" x="1397.5" y="902">nodes + edges</text>
  </g>

  <g>
    <rect class="box" x="930" y="840" width="235" height="86" fill="#e2f6ca"/>
    <text class="node-text" x="1047.5" y="876">XAI explanations</text>
    <text class="node-subtext" x="1047.5" y="902">SHAP evidence</text>
  </g>

  <g>
    <rect class="box" x="900" y="995" width="220" height="74" fill="#fff1c7"/>
    <text class="node-text" x="1010" y="1024">GraphRAG docs</text>
    <text class="node-subtext" x="1010" y="1049">retrieval content</text>
  </g>

  <g>
    <rect class="box" x="1190" y="995" width="165" height="74" fill="#d9f2ee"/>
    <text class="node-text" x="1272.5" y="1024">AI Search</text>
    <text class="node-subtext" x="1272.5" y="1049">index + CDF</text>
  </g>

  <g>
    <rect class="box" x="1400" y="995" width="130" height="74" fill="#f0e5ff"/>
    <text class="node-text" x="1465" y="1024">AI Playground</text>
    <text class="node-subtext" x="1465" y="1049">chat demo</text>
  </g>

  <!-- Local arrows -->
  <path class="arrow" d="M218 247 L218 315"/>
  <text class="arrow-label" x="175" y="288">start</text>

  <path class="arrow" d="M370 358 L475 358"/>
  <text class="arrow-label" x="422" y="342">source URLs</text>

  <path class="arrow" d="M600 409 L600 500"/>
  <text class="arrow-label" x="665" y="463">crawl queue</text>

  <path class="arrow" d="M475 547 L370 547"/>
  <text class="arrow-label" x="422" y="531">raw pages</text>

  <path class="arrow" d="M235 594 L235 685"/>
  <text class="arrow-label" x="185" y="646">evidence</text>

  <path class="arrow" d="M370 732 L475 732"/>
  <text class="arrow-label" x="422" y="716">geo votes</text>

  <path class="arrow" d="M600 779 L600 870"/>
  <text class="arrow-label" x="665" y="832">export</text>

  <!-- Bridge to Databricks -->
  <path class="arrow" d="M725 911 C790 820 805 285 930 206"/>
  <text class="arrow-label" x="820" y="575">upload to volume</text>

  <!-- Databricks arrows -->
  <path class="arrow" d="M1045 247 L1045 315"/>
  <text class="arrow-label" x="1100" y="288">load</text>

  <path class="arrow" d="M1165 358 L1280 358"/>
  <text class="arrow-label" x="1222" y="342">candidate logic</text>

  <path class="arrow" d="M1398 401 L1398 500"/>
  <text class="arrow-label" x="1462" y="460">features</text>

  <path class="arrow" d="M1280 547 L1165 547"/>
  <text class="arrow-label" x="1222" y="531">scores</text>

  <path class="arrow" d="M1165 582 L1280 650"/>
  <text class="arrow-label" x="1224" y="612">clear</text>

  <path class="arrow" d="M1048 594 L1048 685"/>
  <text class="arrow-label" x="960" y="646">ambiguous</text>

  <path class="arrow" d="M1165 728 L1280 682"/>
  <text class="arrow-label" x="1222" y="692">resolve</text>

  <path class="arrow" d="M1398 706 L1398 840"/>
  <text class="arrow-label" x="1464" y="776">graph build</text>

  <path class="arrow" d="M1280 883 L1165 883"/>
  <text class="arrow-label" x="1222" y="867">explain</text>

  <path class="arrow" d="M1048 926 L1048 995"/>
  <text class="arrow-label" x="970" y="966">xai evidence</text>

  <path class="arrow" d="M1398 926 L1120 995"/>
  <text class="arrow-label" x="1265" y="970">graph context</text>

  <path class="arrow" d="M1120 1032 L1190 1032"/>
  <text class="arrow-label" x="1155" y="1015">index</text>

  <path class="arrow" d="M1355 1032 L1400 1032"/>
  <text class="arrow-label" x="1378" y="1015">tool</text>
</svg>
